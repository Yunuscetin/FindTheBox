services:
  - type: web
    name: find-the-box-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-v2.txt
    startCommand: uvicorn v2.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
